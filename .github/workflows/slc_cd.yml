name: SLC-CD

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

env:
  RELEASE_NAME: "${{ github.ref_name }}"

jobs:
  prepare-test-container:
    permissions:
      contents: read
    uses: $/.github/workflows/slc_ci_prepare_test_container.yml
    secrets:
      CI4_DOCKERHUB_USERNAME: ${{ secrets.CI4_DOCKERHUB_USERNAME }}
      CI4_DOCKERHUB_TOKEN: ${{ secrets.CI4_DOCKERHUB_TOKEN }}

  get-flavors:
    needs: prepare-test-container
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: 'recursive'

      - name: Setup Python & Poetry Environment
        uses: exasol/python-toolbox/.github/actions/python-environment@v10
        with:
          python-version: "3.10"
          poetry-version: "2.3.0"

      - id: set-matrix
        run: poetry run -- exaslc-ci get-flavors --github-output-var matrix

    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

  cd:
    needs: get-flavors
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        flavor: ${{fromJson(needs.get-flavors.outputs.matrix)}}
    uses: $/.github/workflows/slc_cd_flavor.yml
    secrets:
      CI4_DOCKERHUB_USERNAME: ${{ secrets.CI4_DOCKERHUB_USERNAME }}
      CI4_DOCKERHUB_TOKEN: ${{ secrets.CI4_DOCKERHUB_TOKEN }}
    with:
      flavor: ${{ matrix.flavor }}

  release:
    needs: cd
    name: Create Github release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: SCM Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Logs
        id: download-logs
        uses: actions/download-artifact@v7
        with:
          pattern: logs_*
          merge-multiple: false
          path: "logs"

      - name: Zip logs
        run: zip -r logs.zip logs

      - name: GitHub Release
        run: >
          gh release create "$RELEASE_NAME"
          --title "SLC ${GITHUB_REF_NAME}"
          --notes-file "./doc/changes/changes_${GITHUB_REF_NAME}.md"
          --draft
          logs.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload-release-slc:
    needs: [get-flavors, release]
    permissions:
      contents: write
    strategy:
      matrix:
        flavor: ${{fromJson(needs.get-flavors.outputs.matrix)}}
    uses: $/.github/workflows/slc_cd_upload_to_release.yml
    with:
      flavor: ${{ matrix.flavor }}
      release-name: ${{ github.ref_name }}
    secrets:
      CI4_DOCKERHUB_USERNAME: ${{ secrets.CI4_DOCKERHUB_USERNAME }}
      CI4_DOCKERHUB_TOKEN: ${{ secrets.CI4_DOCKERHUB_TOKEN }}
