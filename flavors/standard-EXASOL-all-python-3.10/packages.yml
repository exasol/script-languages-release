build_steps:
- name: udfclient_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: coreutils
        version: 8.32-4.1ubuntu*
      - name: locales
        version: 2.35-0ubuntu*
      - name: libnss-db
        version: 2.2.3pre1-6ubuntu*
      - name: libzmq3-dev
        version: 4.3.4-2
      - name: libprotobuf-dev
        version: 3.12.4-1ubuntu*
      - name: libssl-dev
        version: 3.0.2-0ubuntu*
    variables:
      PROTOBUF_LIBRARY_PREFIX: /usr/lib/
      PROTOBUF_INCLUDE_PREFIX: /usr/include/
      ZMQ_LIBRARY_PREFIX: /usr/lib
      ZMQ_INCLUDE_PREFIX: /usr/include
  validation_cfg:
    version_mandatory: true
- name: language_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: ca-certificates
        version: 20260601~22.04.1
      - name: python3.10-dev
        version: 3.10.12*
      - name: python3-distutils
        version: 3.10.8*
      - name: curl
        version: 7.81.0-1ubuntu*
      - name: chrpath
        version: 0.16-2
    variables:
      PYTHON3_PREFIX: /usr
      PYTHON3_VERSION: python3.10
  - name: phase_python_binary
    tools:
      python_binary_path: /usr/bin/python3.10
  - name: install_pip
    tools:
      pip:
        version: '21.3.1'
        needs_break_system_packages: false
  - name: install_pip_packages
    pip:
      install_build_tools_ephemerally: false
      packages:
      - extras: []
        name: pandas
        version: ==2.3.3
      - extras: []
        name: numpy
        version: ==2.2.6
      - extras: []
        name: pyarrow
        version: ==25.0.1
  validation_cfg:
    version_mandatory: true
- name: flavor_base_deps
  phases:
  - name: install_apt_packages
    apt:
      packages:
      - name: unzip
        version: 6.0-26ubuntu*
      - name: git
        version: 1:2.34.1-1ubuntu*
      - name: libcurl4-openssl-dev
        version: 7.81.0-1ubuntu*
      - name: openssl
        version: 3.0.2-0ubuntu*
      - comment: Needed by python-ldap
        name: libsasl2-dev
        version: 2.1.27+dfsg2-3ubuntu*
      - name: libldap2-dev
        version: 2.5.20+dfsg-0ubuntu*
      - name: slapd
        version: 2.5.20+dfsg-0ubuntu*
      - name: ldap-utils
        version: 2.5.20+dfsg-0ubuntu*
      - name: libsmbclient
        version: 2:4.15.13+dfsg-0ubuntu*
      - name: libsmbclient-dev
        version: 2:4.15.13+dfsg-0ubuntu*
      - name: smbclient
        version: 2:4.15.13+dfsg-0ubuntu*
      - name: libgomp1
        version: 12.3.0-1ubuntu*
      - name: tzdata
        version: 2026*
      - name: libleveldb-dev
        version: 1.23-3build1
  - name: install_pip_packages
    pip:
      install_build_tools_ephemerally: true
